<rect width="1200" height="130" rx="16" fill="#12142e"/>
<text x="24" y="36" fill="#fff" font-size="20" font-weight="bold" font-family="Arial,sans-serif">Every step colours nodes with one of six states</text>
<circle cx="70" cy="86" r="22" fill="#9aa0c8" stroke="#fff" stroke-width="2"/>
<text x="104" y="92" fill="#e6e8ff" font-size="17" font-family="Arial,sans-serif">idle</text>
