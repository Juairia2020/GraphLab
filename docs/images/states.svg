<text x="294" y="92" fill="#e6e8ff" font-size="17" font-family="Arial,sans-serif">frontier</text>
<circle cx="450" cy="86" r="22" fill="#10b981" stroke="#fff" stroke-width="2"/>
<text x="484" y="92" fill="#e6e8ff" font-size="17" font-family="Arial,sans-serif">visited</text>
<circle cx="640" cy="86" r="22" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="674" y="92" fill="#e6e8ff" font-size="17" font-family="Arial,sans-serif">chosen</text>
